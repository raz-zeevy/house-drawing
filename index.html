<style>
  /* The drawing is a card on a quiet ground with a caption bar under it.
     Upright phones: the card fills the screen and becomes a window onto the street. */
  :root { --ground: #ebe8e2; --paper: #fdfcf8; --ink: #3a352d; --muted: #7a7267; --accent: #8e3b2c; --edge: rgba(40, 34, 26, .10); --shadow: rgba(40, 34, 26, .35); }
  @media (prefers-color-scheme: dark) { :root { --ground: #1c1e24; --ink: #e6e1d8; --muted: #a39d93; --accent: #d08a6e; --edge: rgba(255, 255, 255, .08); --shadow: rgba(0, 0, 0, .6); color-scheme: dark; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.45 Georgia, 'Times New Roman', serif; box-sizing: border-box;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card, .bar { width: min(100%, calc((100vh - 110px) * 1280 / 440)); }
  .card { aspect-ratio: 1280 / 440; border-radius: 16px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--edge), 0 18px 50px -18px var(--shadow); }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; color: var(--muted); }
  #hint { font-style: italic; min-width: 0; }
  /* moon ... slider ... sun; the clock rides above the thumb */
  .time { display: flex; align-items: center; gap: 10px; color: var(--ink); padding-top: 18px; }
  .time svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .track { position: relative; width: 200px; --pos: .5; }
  #time { display: block; width: 100%; margin: 0; accent-color: var(--accent); }
  #clock { position: absolute; bottom: calc(100% + 2px); left: calc(var(--pos) * (100% - 16px) + 8px); transform: translateX(-50%);
           font: 12px/1 ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
  #time:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-aspect-ratio: 7/5) {
    body { height: 100dvh; padding: 0; gap: 0; justify-content: flex-start; }
    .card { width: 100%; flex: 1; min-height: 0; aspect-ratio: auto; border-radius: 0; box-shadow: none; touch-action: none; }
    .bar { width: 100%; box-sizing: border-box; font-size: 15px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
           padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .time { width: 100%; }
    .track { flex: 1; width: auto; }
  }
</style>
