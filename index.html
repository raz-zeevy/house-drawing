<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Behind the Trees</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

  :root { --ground: #ebe8e2; --paper: #fdfcf8; --edge: rgba(40, 34, 26, .10); --shadow: rgba(40, 34, 26, .35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #1c1e24; --edge: rgba(255, 255, 255, .08); --shadow: rgba(0, 0, 0, .6); color-scheme: dark } }

  html, body { height: 100%; }
  body { background: var(--ground); display: grid; place-items: center; padding-block: 16px; box-sizing: border-box;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .scroll { max-width: 100%; overflow-x: auto; padding-block: 24px; }
  .card { width: min(calc(100vw - 32px), calc((100vh - 96px) * 1280 / 440)); min-width: 720px; aspect-ratio: 1280 / 440; border-radius: 16px; overflow: hidden; background: var(--paper);
          box-shadow: 0 0 0 1px var(--edge), 0 18px 50px -18px var(--shadow); touch-action: pan-x; }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
</style>
