<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype D · Houses on the street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
<link rel="stylesheet" href="./proto.css">
<link rel="stylesheet" href="./houses.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <header class="top">
    <button id="mapBtn" class="ink-btn" type="button" aria-label="Show the map of the street" aria-pressed="false" title="Map of the street">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g filter="url(#wob)"><path d="M6 11.2 L15 7.6 L24.2 11 L33.4 7.4 L33.8 30 L24.4 33.6 L15.2 30.2 L6.4 33.8Z"/><path d="M15 7.6 Q15.4 19 15.2 30.2 M24.2 11 Q24 22 24.4 33.6" stroke-width="1.1"/><path d="M9.6 26 Q13 20.4 17 22.6 T26 17.4" stroke-dasharray="1.4 2.4" stroke-width="1.2"/><path d="M28.3 13.6 a2.3 2.3 0 1 1 -0.1 0Z M28.2 18 l0 2.2" stroke-width="1.3"/></g></svg>
    </button>
  </header>
  <div class="card">
    <div id="stage"></div>
    <div id="map"></div>
    <button class="arrow prev ink-btn" type="button" aria-label="Previous house" title="Previous house">
      <svg viewBox="0 0 54 54" aria-hidden="true"><g filter="url(#wob)"><path class="disc" d="M27 4.6 C39.5 4 49.6 13.6 49.4 26.6 C49.6 39.2 39.4 49.6 26.4 49.4 C13.8 49.6 4.2 39.6 4.6 26.8 C4.4 14 14.4 4.4 27 4.6Z"/><path d="M37 27.4 Q27 26.2 16.4 27"/><path d="M23.6 19.6 Q19.4 23.4 16.4 27 Q19.8 30.6 24 34.6"/></g></svg>
    </button>
    <button class="arrow next ink-btn" type="button" aria-label="Next house" title="Next house">
      <svg viewBox="0 0 54 54" aria-hidden="true"><g filter="url(#wob)"><path class="disc" d="M27 4.6 C39.5 4 49.6 13.6 49.4 26.6 C49.6 39.2 39.4 49.6 26.4 49.4 C13.8 49.6 4.2 39.6 4.6 26.8 C4.4 14 14.4 4.4 27 4.6Z"/><path d="M17 27.4 Q27 26.2 37.6 27"/><path d="M30.4 19.6 Q34.6 23.4 37.6 27 Q34.2 30.6 30 34.6"/></g></svg>
    </button>
  </div>
  <p class="name" id="name"></p>
  <div class="bar"><div class="time sky"><div class="track"><input id="time" type="range" min="0" max="1" step="0.001" value="0.8" aria-label="Time of day: drag the sun or the moon"><span class="orb" aria-hidden="true"><svg class="moon" viewBox="0 0 20 20"><path d="M13.6 3.2a7 7 0 1 0 3.4 10.6A6 6 0 0 1 13.6 3.2z"/></svg><svg class="sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg></span><span id="clock"></span></div></div></div>
  <script type="module" src="./houses.ts"></script>
</body>
</html>
